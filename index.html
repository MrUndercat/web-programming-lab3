<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>2048 — Лабораторная</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <header>
        <h1>2048 — Лабораторная</h1>
        <div class="controls">
            <div class="scoreboard">
                <div>Счёт</div>
                <div id="score" class="scorebox">0</div>
                <div>Лучший</div>
                <div id="best" class="scorebox">0</div>
            </div>
            <div class="buttons">
                <button id="undoBtn">Отмена хода</button>
                <button id="restartBtn">Начать заново</button>
                <button id="leaderBtn">Таблица рекордов</button>
            </div>
        </div>
    </header>

    <div class="game-wrap">
        <div class="board" id="board" aria-label="Игровое поле"></div>

        <div class="game-info">
            <p>Управление: стрелки клавиатуры (десктоп). На мобильных — виртуальные кнопки или свайпы.</p>
            <div class="mobile-controls" id="mobileControls">
                <button data-dir="up">↑</button>
                <div class="mobile-controls-row">
                    <button data-dir="left">←</button>
                    <button data-dir="right">→</button>
                </div>
                <button data-dir="down">↓</button>
            </div>
        </div>
    </div>
</div>

<div id="gameOverModal" class="modal">
    <div class="card">
        <div id="gameOverMsg">Игра окончена</div>
        <div id="saveWrap" class="save-wrap">
            <input id="playerName" placeholder="Введите имя" />
            <div class="save-buttons">
                <button id="saveScoreBtn">Сохранить результат</button>
                <button id="restartBtn2">Начать заново</button>
            </div>
        </div>
        <div id="savedMsg">Ваш рекорд сохранён.</div>
    </div>
</div>

<div id="leaderModal" class="modal">
    <div class="card leaderboard">
        <h3>Топ-10 рекорд</h3>
        <table id="leaderTable"><thead><tr><th>#</th><th>Имя</th><th>Очки</th><th>Дата</th></tr></thead><tbody></tbody></table>
        <div class="leader-actions">
            <button id="closeLeader">Закрыть</button>
            <button id="clearLeaders">Очистить</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
